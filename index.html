var wTimeout;
try {
  var _tw = new Worker(URL.createObjectURL(new Blob(
    ['self.onmessage=function(e){setTimeout(function(){self.postMessage(e.data)},e.data.d)}'],
    {type:'application/javascript'}
  )));
  var _tcb = {}, _tid = 0;
  _tw.onmessage = function(e) { var f=_tcb[e.data.id]; if(f){delete _tcb[e.data.id];f();} };
  wTimeout = function(fn, delay) { var id=++_tid; _tcb[id]=fn; _tw.postMessage({id:id,d:delay}); };
} catch(e) { wTimeout = function(fn, delay) { setTimeout(fn, delay); }; }

// â"€â"€ INTRO ANIMATION â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€â"€
(function() {
  var intro = document.getElementById('intro');
  var container = document.getElementById('intro-text');
  var lines = [
    'hi jolene.',
    'i know i get super busy sometimes',
    'so i made you this',
    'everything about us, right here.',
  ];
  var CHAR_MS = 40, LINE_PAUSE = 300, lineIdx = 0, activeEl = null;
  function nextLine() {
    if (lineIdx >= lines.length) {
      if (activeEl) activeEl.classList.add('done');
      wTimeout(function() { intro.classList.add('fade-out'); wTimeout(function() { intro.remove(); }, 800); }, 700);
      return;
    }
    if (activeEl) activeEl.classList.add('done');
    var span = document.createElement('span');
    span.className = 'intro-line';
    container.appendChild(span);
    activeEl = span;
    var text = lines[lineIdx++], i = 0;
    function typeChar() {
      if (i < text.length) { span.textContent += text[i++]; wTimeout(typeChar, CHAR_MS); }
      else { wTimeout(nextLine, LINE_PAUSE); }
    }
    typeChar();
  }
  nextLine();
})();

// ── COUNTDOWN ─────────────────────────────────────────────────────

var NEXT_VISIT = new Date('2026-09-18T22:00:00Z'); // Sep 18, 6pm EDT (UTC-4)
var NEXT_VISIT_LABEL = 'September 18, 2026 · 6pm';
function getCountdownParts() {
  var diff = NEXT_VISIT - Date.now();
  if (diff <= 0) return null;
  var s = Math.floor(diff / 1000);
  var d = Math.floor(s / 86400); s -= d * 86400;
  var h = Math.floor(s / 3600); s -= h * 3600;
  var m = Math.floor(s / 60); s -= m * 60;
  return { d: d, h: h, m: m, s: s };
}
function pad(n) { return n < 10 ? '0'+n : ''+n; }

// ── BIRTHDAY ──────────────────────────────────────────────────────

var JOLENE_BORN_YEAR = 2006, BDAY_MONTH = 8, BDAY_DAY = 24; // month is 0-indexed: 8 = September
function getBirthday() {
  var now = new Date();
  var year = now.getFullYear();
  var start = new Date(year, BDAY_MONTH, BDAY_DAY, 0, 0, 0, 0);
  var end = new Date(year, BDAY_MONTH, BDAY_DAY + 1, 0, 0, 0, 0);
  if (now >= end) {
    year += 1;
    start = new Date(year, BDAY_MONTH, BDAY_DAY, 0, 0, 0, 0);
    end = new Date(year, BDAY_MONTH, BDAY_DAY + 1, 0, 0, 0, 0);
  }
  var age = year - JOLENE_BORN_YEAR;
  if (now >= start && now < end) return { today: true, age: age, year: year };
  var s = Math.floor((start - now) / 1000);
  var d = Math.floor(s / 86400); s -= d * 86400;
  var h = Math.floor(s / 3600); s -= h * 3600;
  var m = Math.floor(s / 60); s -= m * 60;
  return { today: false, age: age, year: year, d: d, h: h, m: m, s: s };
}
var CONFETTI_COUNT = 44, BALLOON_COUNT = 7;
var CONFETTI_SHAPES = ['', 'c-circle', 'c-ribbon'];
function buildConfetti() {
  var layer = document.getElementById('confettiLayer');
  if (!layer || layer.childElementCount) return;
  var html = '';
  for (var i = 0; i < CONFETTI_COUNT; i++) {
    var tone = 'bd-t' + (1 + (i % 5));
    var shape = CONFETTI_SHAPES[i % CONFETTI_SHAPES.length];
    var left = Math.round((i / CONFETTI_COUNT) * 100 + (Math.random() * 4 - 2));
    var dur = (4.5 + Math.random() * 5).toFixed(2);
    var delay = (Math.random() * 9).toFixed(2);
    var w = 6 + Math.round(Math.random() * 6);
    html += '<i class="'+tone+(shape ? ' '+shape : '')+'" style="left:'+
            Math.max(0, Math.min(99, left))+'%;'+
            'width:'+w+'px;height:'+(w+5)+'px;'+
            'animation-duration:'+dur+'s;animation-delay:-'+delay+'s"></i>';
  }
  layer.innerHTML = html;
}
function buildBalloons() {
  var layer = document.getElementById('balloonLayer');
  if (!layer || layer.childElementCount) return;
  var html = '';
  for (var i = 0; i < BALLOON_COUNT; i++) {
    // Size varies via width/height, not transform - the rise animation owns
    // transform and would overwrite an inline scale. Colour is set inline as a
    // var() on both background and color so the string matches the balloon and
    // both still follow whichever palette is active.
    var tone = 'var(--tone-' + (1 + (i % 5)) + ')';
    var left = Math.round(6 + (i / BALLOON_COUNT) * 88);
    var dur = (13 + Math.random() * 9).toFixed(2);
    var delay = (Math.random() * 14).toFixed(2);
    var w = 22 + Math.round(Math.random() * 16);
    html += '<b style="left:'+left+'%;'+
            'width:'+w+'px;height:'+Math.round(w * 1.27)+'px;'+
            'background:'+tone+';color:'+tone+';'+
            'animation-duration:'+dur+'s;animation-delay:-'+delay+'s"></b>';
  }
  layer.innerHTML = html;
}
function setPartyMode(on) {
  var root = document.documentElement;
  if (on) {
    buildConfetti();
    buildBalloons();
    root.setAttribute('data-party', 'on');
  } else {
    root.removeAttribute('data-party');
  }
  syncThemeColor();
}

// ── MARKDOWN ──────────────────────────────────────────────────────

function md(text) {
  var out = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  out = out.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/\*(.*?)\*/g, '<em>$1</em>');
  out = out.replace(/(?<!!)\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  var lines = out.split('\n'), result = [], i = 0;
  while (i < lines.length) {
    var line = lines[i];
    if (line.startsWith('## ')) { result.push({ type:'block', html:'<h3 class="mh">'+line.slice(3)+'</h3>' }); i++; continue; }
    if (line.trim() === '---') { result.push({ type:'block', html:'<hr class="mhr">' }); i++; continue; }
    var imgMatch = line.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);
    if (imgMatch) {
      result.push({ type:'block', html:'<figure class="chat-img"><img src="'+imgMatch[2]+'" alt="'+imgMatch[1]+'" loading="lazy" onerror="this.parentElement.style.display=\'none\'"></figure>' });
      i++; continue;
    }
    if (line.startsWith('- ')) {
      var items = [];
      while (i < lines.length && lines[i].startsWith('- ')) { items.push('<li>'+lines[i].slice(2)+'</li>'); i++; }
      result.push({ type:'block', html:'<ul class="mul">'+items.join('')+'</ul>' }); continue;
    }
    if (line.trim() === '') { result.push({ type:'break' }); i++; continue; }
    result.push({ type:'text', content:line }); i++;
  }
  var final = [], pBuf = [];
  for (var ri = 0; ri < result.length; ri++) {
    var r = result[ri];
    if (r.type === 'text') { pBuf.push(r.content); }
    else { if (pBuf.length) { final.push('<p>'+pBuf.join('<br>')+'</p>'); pBuf = []; } if (r.type === 'block') final.push(r.html); }
  }
  if (pBuf.length) final.push('<p>'+pBuf.join('<br>')+'</p>');
  return final.join('\n');
}

// ── WILL'S SCHEDULE ───────────────────────────────────────────────

function getWillNow() {
  var now = new Date();
  var day = now.getDay(), h = now.getHours(), m = now.getMinutes();
  var t = h * 60 + m;
  function between(sh, sm, eh, em) { return t >= sh*60+sm && t < eh*60+em; }
  function fmt(sh, sm) { var a = sh<12?'am':'pm', h12=sh%12||12; return sm===0?h12+a:h12+':'+(sm<10?'0'+sm:sm)+a; }
  var days = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
  // weekends go to the master's coursework
  if (day === 0 || day === 6) {
    return 'it\'s '+days[day]+', so no scale ai - he\'s on coursework for the georgia tech master\'s.';
  }
  // Weekday blocks covering all 24 hours. Sleep wraps past midnight, so it sits
  // outside this list and is handled after it.
  var blocks = [
    { sh:4,sm:0,eh:6,em:0,name:'at the gym, then getting ready' },
    { sh:6,sm:0,eh:8,em:0,name:'commuting to work' },
    { sh:8,sm:0,eh:18,em:0,name:'at work - scale ai',
      note:'ten hours of it, so this is most of the day.' },
    { sh:18,sm:0,eh:20,em:0,name:'commuting home' },
    { sh:20,sm:0,eh:21,em:0,name:'having dinner and watching something' }
  ];
  for (var i=0; i<blocks.length; i++) {
    var b = blocks[i];
    if (between(b.sh,b.sm,b.eh,b.em)) {
      var next = null;
      for (var j=i+1; j<blocks.length; j++) { if (blocks[j].sh*60+blocks[j].sm > t) { next=blocks[j]; break; } }
      // names stay short so they read correctly in the "after that" line; any
      // commentary rides along as a note on the current block only
      var s = 'right now he\'s '+b.name+' (until '+fmt(b.eh,b.em)+').';
      if (b.note) s += '\n\n'+b.note;
      if (next) s += '\n\nafter that: '+next.name+' at '+fmt(next.sh,next.sm)+'.';
      else s += '\n\nafter that: asleep at 9pm.';
      return s;
    }
  }
  // 9pm through 4am
  return 'he\'s asleep. the alarm goes off at 4am for the gym.';
}

// ── ANNIVERSARY ──────────────────────────────────────────────────
// Days together, and how long until the next January 17. Like the birthday
// this recurs, so the year is worked out rather than hardcoded.
var ANNIV_YEAR = 2026, ANNIV_MONTH = 0, ANNIV_DAY = 17; // month 0 = January
function getAnniversary() {
  var now = new Date();
  var startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var began = new Date(ANNIV_YEAR, ANNIV_MONTH, ANNIV_DAY);
  var days = Math.round((startOfDay - began) / 86400000);
  var y = now.getFullYear();
  var next = new Date(y, ANNIV_MONTH, ANNIV_DAY);
  var end  = new Date(y, ANNIV_MONTH, ANNIV_DAY + 1);
  var today = now >= next && now < end;
  if (now >= end) { y += 1; next = new Date(y, ANNIV_MONTH, ANNIV_DAY); }
  // how far through the current year they are, for the progress bar
  var prev = new Date(y - 1, ANNIV_MONTH, ANNIV_DAY);
  var progress = Math.max(0, Math.min(1, (now - prev) / (next - prev)));
  return {
    days: days, today: today, years: y - ANNIV_YEAR,
    until: Math.round((next - startOfDay) / 86400000), year: y,
    progress: progress
  };
}

function brStructure() {
  var planks = '', hangers = '', posts = '', i, t, x, d, hd;
  for (i = 0; i < BR_PLANKS; i++) {
    x = BR_X0 + i * BR_PW;
    // --d is the distance out from mid-span, so everything runs centre-outward
    d = Math.abs(i - (BR_PLANKS - 1) / 2) - 0.5;
    planks += '<rect class="bp" style="--d:' + d.toFixed(0) + ';--r:' +
              (i < BR_PLANKS / 2 ? -1 : 1) + '" x="' + x + '" y="' + BR_DECK +
              '" width="' + (BR_PW - 2) + '" height="' + BR_PH + '" rx="1.5"/>';
  }
  for (i = 1; i <= 7; i++) {
    t = i / 8;
    hd = Math.abs(i - 4);
    hangers += '<line class="bh" style="--d:' + hd + '" x1="' + brF(brCableX(t)) + '" y1="' +
               brF(brCableY(t)) + '" x2="' + brF(brCableX(t)) + '" y2="' + BR_DECK + '"/>';
  }
  for (i = 0; i <= 12; i += 2) {
    posts += '<rect x="' + (BR_X0 + i * BR_PW - 1) + '" y="132" width="2" height="11"/>';
  }
  return '<g class="bstruct">' +
    '<rect class="bbank" x="-4" y="184" width="138" height="60"/>' +
    '<rect class="bbank" x="348" y="184" width="136" height="60"/>' +
    '<g class="btowers">' +
      '<rect class="btower" x="125" y="54" width="9" height="142"/>' +
      '<rect class="btower" x="350" y="54" width="9" height="142"/>' +
      '<rect class="btower" x="121" y="51" width="17" height="6" rx="1"/>' +
      '<rect class="btower" x="346" y="51" width="17" height="6" rx="1"/>' +
    '</g>' +
    '<path class="bcable bcable-l" d="M 129.5 60 Q 185.75 104 242 104"/>' +
    '<path class="bcable bcable-r" d="M 242 104 Q 298.25 104 354.5 60"/>' +
    hangers +
    '<g class="brail">' +
      '<rect x="134" y="132" width="216" height="2.4" rx="1"/>' + posts +
    '</g>' +
    '<g class="bdeck">' + planks + '</g>' +
  '</g>';
}

function brFlames() {
  var out = '', i, k, cx, d, big, sx, sy, pos;
  for (i = 0; i < BR_PLANKS; i++) {
    cx = BR_X0 + i * BR_PW + BR_PW / 2 - 1;
    d = Math.abs(i - (BR_PLANKS - 1) / 2) - 0.5;
    for (k = 0; k < BR_TONGUES; k++) {
      // taller tongues near mid-span, where it caught first
      big = 1.8 - 0.16 * d;
      sx = brRand(0.66, 1.02) * big;
      sy = brRand(0.78, 1.26) * big;
      pos = 'translate(' + brF(cx + brRand(-6, 6)) + ',' + (BR_DECK + 2) + ') rotate(' +
            brF(brRand(-9, 9)) + ') scale(' + brF(sx) + ',' + brF(sy) + ')';
      out += '<g transform="' + pos + '">' +
        '<g class="bf" style="--d:' + d.toFixed(0) + ';--k:' + brF(brRand(0, 0.16)) + 's">' +
          '<g class="bf-sw" style="--dur:' + brF(brRand(1.5, 2.7)) + 's">' +
            '<g class="bf-lk" style="--dur:' + brF(brRand(0.26, 0.46)) + 's">' +
              '<path class="bf-p" d="' + BR_TONGUE_D[(i + k) % 3] + '"/>' +
            '</g>' +
          '</g>' +
        '</g>' +
      '</g>';
    }
  }
  var tall = [222, 242, 262];
  for (i = 0; i < tall.length; i++) {
    out += '<g transform="translate(' + brF(tall[i] + brRand(-4, 4)) + ',' + (BR_DECK + 2) +
           ') rotate(' + brF(brRand(-6, 6)) + ') scale(' + brF(brRand(1.05, 1.35)) + ',' +
           brF(brRand(2, 2.5)) + ')">' +
      '<g class="bf" style="--d:0;--k:' + brF(brRand(0.1, 0.3)) + 's">' +
        '<g class="bf-sw" style="--dur:' + brF(brRand(2.2, 3.2)) + 's">' +
          '<g class="bf-lk" style="--dur:' + brF(brRand(0.38, 0.6)) + 's">' +
            '<path class="bf-p" d="' + BR_TONGUE_D[i % 3] + '"/>' +
          '</g>' +
        '</g>' +
      '</g>' +
    '</g>';
  }
  return '<g class="bflames">' + out + '</g>';
}

function brSparks() {
  var deck = '', wreck = '', i;
  for (i = 0; i < BR_EMBERS; i++) {
    deck += '<circle class="be" style="--dx:' + brF(brRand(-52, 52)) + 'px;--rise:' +
            brF(brRand(-124, -68)) + 'px;--dur:' + brF(brRand(1.2, 1.9)) + 's;--dly:' +
            brF(brRand(0.45, 2.2)) + 's" cx="' + Math.round(brRand(140, 344)) +
            '" cy="' + (BR_DECK + 1) + '" r="' + brF(brRand(0.8, 2.1)) + '"/>';
  }
  for (i = 0; i < BR_WRECK; i++) {
    wreck += '<circle class="bwe" style="--dx:' + brF(brRand(-26, 26)) + 'px;--rise:' +
             brF(brRand(-52, -28)) + 'px;--dur:' + brF(brRand(2.6, 4.2)) + 's;--dly:' +
             brF(brRand(4.6, 8.4)) + 's" cx="' + Math.round(brRand(178, 306)) +
             '" cy="' + Math.round(brRand(188, 196)) + '" r="' + brF(brRand(0.7, 1.5)) + '"/>';

  var burst = '';
  for (i = 0; i < 14; i++) {

             '" cy="' + BR_DECK + '" r="' + brF(brRand(1, 2.4)) + '"/>';
  }
  return '<g class="bembers">' + deck + '</g><g class="bburst">' + burst +
         '</g><g class="bwembers">' + wreck + '</g>';
}

function brSmoke() {
  var deck = '', wreck = '', i;
  var dx = [162, 188, 214, 240, 266, 292, 318];
  for (i = 0; i < dx.length; i++) {
    deck += '<circle class="bs" style="--dx:' + brF(brRand(14, 46)) + 'px;--dur:' +
            brF(brRand(2.7, 3.6)) + 's;--dly:' + brF(1.1 + i * 0.26) + 's" cx="' + dx[i] +

function brDebris() {

function startBridge() {
  var host = document.getElementById('bridgeHost');
  if (!host) return;
  var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  // With motion turned down, skip to the aftermath - the bridge is still gone.
  function run() {
    host.innerHTML = bridgeStageHTML();
    var stage = host.firstChild;
    if (!stage) return;
    void stage.offsetWidth;              // reflow, so the animations restart
    stage.classList.add(reduced ? 'burnt' : 'go');
  }
  run();
  var again = document.getElementById('bridgeAgain');
  if (again) again.addEventListener('click', run);
}

// Each sheet is a set of titled sections pulled from QA. Headings are written
// here rather than reusing QA questions, which were phrased for a chatbot.
var SHEETS = {
  story: { title: 'Our story', sections: [
    ['Who they are', 'about'],
    ['How they met', 'met'],
    ['Making it official', 'official'],
    ['How long it took', 'how_long'],
    ['The distance', 'distance']
  ]},
  timeline: { title: 'Timeline', sections: [
    ['The whole thing, in order', 'timeline'],
    ['The first real date', 'firstdate']
  ]},
  notes: { title: 'Notes from Will', notes: true },
  next: { title: "What's next", sections: [
    ['', 'future'],
    ['Graduation', 'graduate_jolene']
  ]},
  sweet: { title: 'Why this exists', sections: [['', 'sweet']] },
  photos: { title: 'Photos', photos: true },
  her: { title: 'About Jolene', jolene: true },
  bridge: { title: 'That bridge', bridge: true },
  bucket: { title: 'The list', bucket: true }
};

var lastFocused = null;

function sheetHTML(key) {
  var cfg = SHEETS[key];
  if (cfg.jolene) return joleneSheetHTML();
  if (cfg.bridge) return bridgeSheetHTML();
  if (cfg.bucket) return bucketSheetHTML();
  if (cfg.photos) {
    return '<div class="photo-grid">' + photoList().map(function(src) {
      return '<figure class="pg-item"><img src="'+src+'" alt="Will and Jolene" loading="lazy" '+
             'onerror="this.parentElement.style.display=\'none\'"></figure>';
    }).join('') + '</div>';
  }
  if (cfg.notes) {
    return '<ol class="note-list">' + noteList().map(function(n) {
      return '<li class="note-item"><time class="note-item-date">'+n.date+'</time>'+
             '<p class="note-item-text">'+n.text.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</p></li>';
    }).join('') + '</ol>';
  }
  return cfg.sections.map(function(pair) {
    var head = pair[0] ? '<h3 class="sheet-h">'+pair[0]+'</h3>' : '';
    var qa = QA[pair[1]];
    var body = typeof qa.answer === 'function' ? qa.answer() : qa.answer;
    return head + '<div class="sheet-prose">' + md(body) + '</div>';
  }).join('');
}

function openSheet(key) {
  var cfg = SHEETS[key];
  if (!cfg) return;
  lastFocused = document.activeElement;
  document.getElementById('sheetTitle').textContent = cfg.title;
  document.getElementById('sheetBody').innerHTML = sheetHTML(key);
  document.getElementById('sheetBody').scrollTop = 0;
  var sheet = document.getElementById('sheet'), scrim = document.getElementById('sheetScrim');
  scrim.hidden = false; sheet.hidden = false;
  document.body.classList.add('sheet-open');
  document.getElementById('sheetClose').focus();
  // let the markup land before kicking the animation off
  if (cfg.bridge) setTimeout(startBridge, 40);
}
function closeSheet() {
  document.getElementById('sheet').hidden = true;
  document.getElementById('sheetScrim').hidden = true;
  document.body.classList.remove('sheet-open');
  // openSheet rebuilds the body every time, so dropping it here is free and
  // stops the bridge's looping animations and the photo grid from lingering
  document.getElementById('sheetBody').innerHTML = '';
  if (lastFocused && lastFocused.focus) lastFocused.focus();
}

// ── THE PIXEL WORLD ──────────────────────────────────────────────
// Renders at 240x160 - the actual Game Boy Advance resolution - then
// integer-scales up, so every pixel stays square. Movement is grid-based and
// tweened the way the games it is copying did it, which also makes collision
// a single array lookup.
//
// Areas, tiles and sprites are all generated data (PX_AREAS, PX_TILES,
// PX_SPR). PX_SOLIDT comes from the same list the generator's reachability
// check uses, so the game and the check can never disagree about what blocks.

var PXT = 16;                    // tile size, px
var PXVW = 240, PXVH = 160;      // internal viewport, GBA-sized
var PX_STEP = 180;               // ms per tile of walking
var PX_START = ['apartment', 9, 9, 'down'];
// sprites are taller than a tile, so they are drawn lifted by the overhang
var PX_LIFT = 0;   // set once PX_H is known

var pxState = null;

function pxArea() { return PX_AREAS[pxState.area]; }
function pxTile(x, y) {
  var m = pxArea().map;
  if (y < 0 || y >= m.length) return 'T';
  if (x < 0 || x >= m[y].length) return 'T';
  return m[y].charAt(x);
}
function pxNpcAt(x, y) {
  var n = pxArea().npcs;
  for (var i = 0; i < n.length; i++) if (n[i].x === x && n[i].y === y) return n[i];
  return null;
}
function pxWalkable(x, y) {
  var m = pxArea().map;
  if (y < 0 || y >= m.length || x < 0 || x >= m[y].length) return false;
  var c = pxTile(x, y);
  if (c === 'D') return true;                  // doors are warps, walk onto them
  return !PX_SOLIDT[c] && !pxNpcAt(x, y);
}

// ── drawing ──────────────────────────────────────────────────────
function pxDrawTile(ctx, ch, x, y) {
  var t = PX_TILES[ch] || PX_TILES['.'];
  ctx.fillStyle = t[0];
  ctx.fillRect(x, y, PXT, PXT);
  var d = t[1];
  for (var i = 0; i < d.length; i++) {
    ctx.fillStyle = d[i][0];
    ctx.fillRect(x + d[i][1], y + d[i][2], d[i][3], d[i][4]);
  }
}
function pxDrawSprite(ctx, key, frame, px, py, palName) {
  var rows = PX_SPR[key][frame].split('|');
  var pal = PX_PAL[palName];
  for (var y = 0; y < rows.length; y++) {
    var row = rows[y];
    for (var x = 0; x < row.length; x++) {
      var c = row.charAt(x);
      if (c === '.') continue;
      ctx.fillStyle = pal[c];
      ctx.fillRect(px + x, py + y, 1, 1);
    }
  }
}

// Whether she is mid-step is derived from the clock, never stored. The
// renderer used to clear a flag, which meant a stalled requestAnimationFrame -
// a backgrounded tab, a hidden window - wedged her in place permanently.
function pxMoving(s) {
  return s.moveStart > 0 && (performance.now() - s.moveStart) < PX_STEP;
}
function pxFrameFor(s) { return pxMoving(s) ? ((s.stepPhase % 2) ? 'walkA' : 'walkB') : 'stand'; }

function pxRender() {
  var s = pxState;
  if (!s) return;
  var ctx = s.ctx, a = pxArea(), m = a.map;

  var t = pxMoving(s) ? (performance.now() - s.moveStart) / PX_STEP : 1;
  var pxp = (s.fromX + (s.x - s.fromX) * t) * PXT;
  var pyp = (s.fromY + (s.y - s.fromY) * t) * PXT;

  // a map smaller than the viewport is centred rather than pinned to a corner

  var camY = worldH <= PXVH ? (worldH - PXVH) / 2
           : Math.max(0, Math.min(worldH - PXVH, pyp + PXT / 2 - PXVH / 2));
  camX = Math.round(camX); camY = Math.round(camY);

  ctx.fillStyle = '#161016';
  ctx.fillRect(0, 0, PXVW, PXVH);
  ctx.save();
  ctx.translate(-camX, -camY);

  var x0 = Math.floor(camX / PXT), y0 = Math.floor(camY / PXT);
  for (var ty = y0; ty <= y0 + PXVH / PXT + 1; ty++) {
    for (var tx = x0; tx <= x0 + PXVW / PXT + 1; tx++) {
      if (ty < 0 || ty >= m.length || tx < 0 || tx >= m[0].length) continue;
      pxDrawTile(ctx, pxTile(tx, ty), tx * PXT, ty * PXT);
    }
  }
  for (var i = 0; i < a.npcs.length; i++) {
    var n = a.npcs[i];
    pxDrawSprite(ctx, n.spr, 'stand', n.x * PXT, n.y * PXT - PX_LIFT, n.pal);
  }
  pxDrawSprite(ctx, pxKeyFor(s.dir), pxFrameFor(s), Math.round(pxp), Math.round(pyp) - PX_LIFT, 'jolene');

  // you can actually read rather than scenery
  if (!s.talking && !pxMoving(s)) {
    var f = pxFacing(s);
    if (pxHasTalk(f[0], f[1])) {

      ctx.fillStyle = '#f4ecd8'; ctx.fillRect(bx, by, 5, 7);
      ctx.fillStyle = '#241a14';
      ctx.fillRect(bx + 2, by + 1, 1, 3); ctx.fillRect(bx + 2, by + 5, 1, 1);
    }
  }
  ctx.restore();

  s.raf = requestAnimationFrame(pxRender);
}

function pxTick() {
  var s = pxState;
  if (!s || pxMoving(s) || s.talking) return;
  if (s.moveStart) {                       // a step just finished
    s.fromX = s.x; s.fromY = s.y; s.moveStart = 0;
    var w = pxArea().warps[s.x + ',' + s.y];
    if (w) { pxGo(w[0], w[1], w[2], w[3]); return; }
  }
  var d = s.held[s.held.length - 1];
  if (d) pxMove(d);
}

function pxMove(dir) {
  var s = pxState;
  if (!s || pxMoving(s) || s.talking) return;
  s.dir = dir;
  var dx = dir === 'left' ? -1 : dir === 'right' ? 1 : 0;
  var dy = dir === 'up' ? -1 : dir === 'down' ? 1 : 0;
  var nx = s.x + dx, ny = s.y + dy;
  if (!pxWalkable(nx, ny)) return;          // turn on the spot, like the games
  s.fromX = s.x; s.fromY = s.y;
  s.x = nx; s.y = ny;

function pxGo(area, x, y, dir) {
  var s = pxState;

  s.dir = dir || s.dir; s.moveStart = 0; s.held = [];

function pxLines(v) {

  if (!lines) return;
  s.talking = lines.slice();
  s.talkAt = 0;
  pxShowLine();
}
function pxShowLine() {
  var box = document.getElementById('pxTalk');
  box.textContent = pxState.talking[pxState.talkAt];
  box.hidden = false;
}
function pxAdvance() {
  var s = pxState;
  s.talkAt++;
  if (s.talkAt >= s.talking.length) {
    s.talking = null;
    document.getElementById('pxTalk').hidden = true;
    return;
  }
  pxShowLine();
}

// ── open / close ─────────────────────────────────────────────────
var PX_DIRKEY = {
  ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
  w: 'up', s: 'down', a: 'left', d: 'right',
  W: 'up', S: 'down', A: 'left', D: 'right'
};
function pxKeyDown(e) {
  if (!pxState) return;
  if (e.key === 'Escape') { pxClose(); return; }
  if (e.key === ' ' || e.key === 'Enter' || e.key === 'e' || e.key === 'E') {
    e.preventDefault(); pxInteract(); return;
  }
  var d = PX_DIRKEY[e.key];
  if (!d) return;
  e.preventDefault();
  if (pxState.held.indexOf(d) === -1) pxState.held.push(d);
  pxMove(d);
}
function pxKeyUp(e) {
  if (!pxState) return;
  var d = PX_DIRKEY[e.key];
  if (!d) return;
  var i = pxState.held.indexOf(d);
  if (i > -1) pxState.held.splice(i, 1);
}

function pxFit() {
  if (!pxState) return;
  var wrap = document.getElementById('pxStage');
  // Integer scaling keeps pixels perfectly square, but the integer step on a
  // phone is 1x and the game ends up postage-stamp sized. Below 2x, fill the
  // space instead - slightly uneven pixels beat unreadable ones.
  var raw = Math.min(wrap.clientWidth / PXVW, wrap.clientHeight / PXVH);
  var scale = raw >= 2 ? Math.floor(raw) : Math.max(1, raw);
  pxState.canvas.style.width = (PXVW * scale) + 'px';
  pxState.canvas.style.height = (PXVH * scale) + 'px';
}

function pxOpen() {
  if (pxState) return;
  document.getElementById('pxWorld').hidden = false;
  document.body.classList.add('px-open');
  var c = document.getElementById('pxCanvas');
  c.width = PXVW; c.height = PXVH;
  var ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  PX_LIFT = PX_H - PXT;
  pxState = { canvas: c, ctx: ctx, area: PX_START[0], x: PX_START[1], y: PX_START[2],
              dir: PX_START[3], moveStart: 0, fromX: PX_START[1], fromY: PX_START[2],
              stepPhase: 0, held: [], talking: null, raf: 0, tick: 0 };
  document.getElementById('pxPlace').textContent = PX_AREAS[pxState.area].name;
  pxState.tick = setInterval(pxTick, 40);
  pxFit();
  document.addEventListener('keydown', pxKeyDown);
  document.addEventListener('keyup', pxKeyUp);
  window.addEventListener('resize', pxFit);
  document.getElementById('pxClose').focus();
  pxRender();
}
function pxClose() {
  if (!pxState) return;
  cancelAnimationFrame(pxState.raf);
  clearInterval(pxState.tick);
  document.removeEventListener('keydown', pxKeyDown);
  document.removeEventListener('keyup', pxKeyUp);
  window.removeEventListener('resize', pxFit);
  pxState = null;
  document.getElementById('pxTalk').hidden = true;
  document.getElementById('pxWorld').hidden = true;
  document.body.classList.remove('px-open');
  var t = document.getElementById('crewBtn');
  if (t) t.focus();
}

// ── the two sprites in the masthead ──────────────────────────────
function pxPaintBadge(canvas, key, palName) {
  canvas.width = PX_W; canvas.height = PX_H;
  var ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, PX_W, PX_H);
  pxDrawSprite(ctx, key, 'stand', 0, 0, palName);
}
function renderCrew() {
  var w = document.getElementById('crewWill'), j = document.getElementById('crewJolene');
  if (!w || !j) return;
  pxPaintBadge(w, 'will_down', 'will');
  pxPaintBadge(j, 'jol_down', 'jolene');
  document.getElementById('crewBtn').addEventListener('click', pxOpen);
  document.getElementById('pxClose').addEventListener('click', pxClose);
  document.getElementById('pxScrim').addEventListener('click', pxClose);
  document.querySelectorAll('[data-px-dir]').forEach(function(el) {
    var dir = el.dataset.pxDir, timer = 0;
    function go(e) {
      e.preventDefault();
      pxMove(dir);
      if (pxState && pxState.held.indexOf(dir) === -1) pxState.held.push(dir);
      clearInterval(timer);
      timer = setInterval(function() { pxMove(dir); }, PX_STEP);
    }
    function stop() {
      clearInterval(timer);
      if (pxState) { var i = pxState.held.indexOf(dir); if (i > -1) pxState.held.splice(i, 1); }
    }
    el.addEventListener('pointerdown', go);
    el.addEventListener('pointerup', stop);
    el.addEventListener('pointerleave', stop);
    el.addEventListener('pointercancel', stop);
  });
  document.getElementById('pxA').addEventListener('click', pxInteract);
}

// ── TILES ────────────────────────────────────────────────────────
function renderVisitTile() {
  document.getElementById('visitDate').textContent = NEXT_VISIT_DATE_LABEL;
  function tick() {
    var p = getCountdownParts();
    var row = document.getElementById('visitCd');
    if (!p) { row.innerHTML = '<span class="cd-passed">it&#39;s here</span>'; return; }
    var d = document.getElementById('v-d'); if (!d) return;
    d.textContent = p.d;
    document.getElementById('v-h').textContent = pad(p.h);
    document.getElementById('v-m').textContent = pad(p.m);
    document.getElementById('v-s').textContent = pad(p.s);
  }
  tick(); setInterval(tick, 1000);
}

function renderBdayTile() {
  function tick() {
    var b = getBirthday();
    var body = document.getElementById('bdayBody');
    var foot = document.getElementById('bdayFoot');
    if (b.today) {
      body.innerHTML = '<span class="bday-today">happy birthday jolene &#9825;</span>';
      foot.textContent = b.age + ' today';
      return;
    }
    body.innerHTML =
      '<span class="bday-big">'+b.d+'</span><span class="bday-unit">days</span>' +
      '<span class="bday-small">'+pad(b.h)+':'+pad(b.m)+':'+pad(b.s)+'</span>';
    foot.textContent = 'september 24 · turning ' + b.age;
  }
  tick(); setInterval(tick, 1000);
}

function renderNoteTile() {
  var notes = noteList();
  if (!notes.length) return;
  var latest = notes[notes.length - 1];
  document.getElementById('noteQuote').textContent = '“' + latest.text + '”';
  document.getElementById('noteDate').textContent = latest.date;
}

function renderNowTile() {
  function tick() {
    var el = document.getElementById('nowText');
    if (el) el.textContent = getWillNow().split('\n')[0];
  }
  tick(); setInterval(tick, 60000);
}

function renderPhotoTile() {
  var photos = photoList().slice();
  for (var s = photos.length - 1; s > 0; s--) {
    var j = Math.floor(Math.random() * (s + 1));
    var swap = photos[s]; photos[s] = photos[j]; photos[j] = swap;
  }
  var a = document.getElementById('photoImg'), b = document.getElementById('photoImgB');
  document.getElementById('photoCount').textContent = photos.length;
  if (!photos.length || !a || !b) return;
  var i = Math.floor(Math.random() * photos.length);
  var front = a, back = b;
  front.src = photos[i];
  front.classList.add('shown');
  setInterval(function() {
    i = (i + 1) % photos.length;
    // Decode first, then fade. Swapping src on a visible layer would flash the
    // empty tile while the next file loads.
    var pre = new Image();
    pre.onload = function() {
      back.src = pre.src;
      back.classList.add('shown');
      front.classList.remove('shown');
      var t = front; front = back; back = t;
    };
    pre.src = photos[i];
  }, 7000);
}

function renderTogetherTile() {
  function tick() {
    var a = getAnniversary();
    var big = document.getElementById('togDays'), next = document.getElementById('togNext');
    if (!big) return;
    big.textContent = a.days.toLocaleString();
    var label = a.years === 1 ? 'one year' : a.years + ' years';
    next.textContent = a.today
      ? label + ' today'
      : label + ' on january 17 · ' + (a.until === 1 ? 'tomorrow' : a.until + ' days away');
    var fill = document.getElementById('togFill');
    if (fill) fill.style.width = (a.progress * 100).toFixed(1) + '%';
  }
  tick();
  setInterval(tick, 60000);
}

function renderListTile() {
  var s = bucketStats(), open = bucketOpen();
  var next = document.getElementById('listNext');
  if (next) next.textContent = open.length
    ? open[Math.floor(Math.random() * open.length)].t
    : 'all of it, done';
  var foot = document.getElementById('listFoot');
  if (foot) foot.textContent = s.done + ' of ' + s.total + ' done';
  var fill = document.getElementById('listFill');
  if (fill) fill.style.width = (s.progress * 100).toFixed(1) + '%';
}

function renderHerTile() {
  var el = document.getElementById('herFact');
  if (el) el.textContent = JOLENE_LINES[Math.floor(Math.random() * JOLENE_LINES.length)];
}

// The staggered entrance is opt-in and always gets torn down. The animation
// starts at opacity 0, so a stalled frame would otherwise leave the board
// blank; clearing the class guarantees the tiles end up visible either way.
function playTileIntro() {
  var bento = document.querySelector('.bento');
  if (!bento) return;
  var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) return;
  bento.classList.add('intro');
  setTimeout(function() { bento.classList.remove('intro'); }, 1400);
}

// ── FALLING LEAVES ───────────────────────────────────────────────
// Same idea as the birthday confetti, but slower and in the fall tones. Runs
// whenever birthday mode is off.
var LEAF_COUNT = 14;
function buildLeaves() {
  var layer = document.getElementById('leafLayer');
  if (!layer || layer.childElementCount) return;
  var html = '';
  for (var i = 0; i < LEAF_COUNT; i++) {
    var tone = 'var(--tone-' + (1 + (i % 5)) + ')';
    var left = Math.round((i / LEAF_COUNT) * 100 + (Math.random() * 6 - 3));
    var dur = (14 + Math.random() * 12).toFixed(2);
    var delay = (Math.random() * 22).toFixed(2);
    var w = 9 + Math.round(Math.random() * 7);
    html += '<i style="left:' + Math.max(0, Math.min(98, left)) + '%;' +
            'width:' + w + 'px;height:' + Math.round(w * 0.8) + 'px;' +
            'background:' + tone + ';' +
            'animation-duration:' + dur + 's;animation-delay:-' + delay + 's"></i>';
  }
  layer.innerHTML = html;
}

// ── INIT ─────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function() {
  renderVisitTile();
  renderBdayTile();
  renderNoteTile();
  renderNowTile();
  renderPhotoTile();
  renderTogetherTile();
  renderHerTile();
  renderListTile();
  renderCrew();
  buildLeaves();
  playTileIntro();

  document.querySelectorAll('[data-sheet]').forEach(function(el) {
    el.addEventListener('click', function() { openSheet(el.dataset.sheet); });
  });
  document.getElementById('bdayTile').addEventListener('click', function() {
    setPartyMode(true);
  });
  document.getElementById('sheetClose').addEventListener('click', closeSheet);
  document.getElementById('sheetScrim').addEventListener('click', closeSheet);
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && !document.getElementById('sheet').hidden) closeSheet();
  });
  document.getElementById('partyOffBtn').addEventListener('click', function() { setPartyMode(false); });

  syncThemeColor();
});
</script>
